name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

      # The runtime must stay stdlib-only: the scheduled run container installs nothing.
      - name: engine imports stdlib only
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          allowed = set(sys.stdlib_module_names) | {
              "archive", "portfolio", "config", "technicals", "sentiment",
              "scanner", "history", "pm", "render", "render_pm", "render_portfolio",
              "validate", "watch", "paper_mirror", "backtest", "fills", "universe",
              "broker_policy", "ledger", "ic", "snapshots", "ladder", "universe_history",
              "house", "health"}
          bad = []
          for p in pathlib.Path("engine").glob("*.py"):
              for node in ast.walk(ast.parse(p.read_text())):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0:
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for n in names:
                      if n and n not in allowed:
                          bad.append(f"{p.name}: {n}")
          if bad:
              print("::error::non-stdlib import in the runtime: " + "; ".join(bad))
              sys.exit(1)
          print("stdlib only")
          PY
